<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code</title>
  <link rel="stylesheet" href="/index_style.css">
</head>

<body class="subpixel-antialiased hyphens-auto size-full min-h-screen">
  <div id="generator" v-show="start" class="max-w-300 mx-auto pt-10 flex gap-10">
    <section class="shadow bg-white rounded-xl basis-80 p-8">
      <div class="size-60 bg-gray-300 mx-auto">
        <template v-if="blobUrl">
          <img :src="blobUrl" class="size-full" alt="" />
        </template>
      </div>

      <div class="px-4 my-3">
        <button type="button" tabindex="-1" class="btn btn-success btn-wide btn-outline" :disabled="loading||!blobUrl" @click="download">下载</button>
      </div>

      <div class="collapse collapse-arrow join-item border-base-300 border">
        <input type="checkbox" name="details" v-model="details" />
        <div class="collapse-title font-semibold text-sm">{{result}}</div>
        <div class="collapse-content">
          <table class="w-full">
            <colgroup>
              <col class="w-2/5" />
              <col class="w-3/5" />
            </colgroup>

            <tbody>
              <tr>
                <td>格式</td>
                <td>
                  <select class="select select-sm" v-model="type" :disabled="loading" @change="onChange">
                    <template v-for="(item, idx) in typeList">
                      <option :value="item.ext">{{ item.name + '(' + item.ext + ')' + (idx === 0 ? ' · 默认' : '') }}</option>
                    </template>
                  </select>
                </td>
              </tr>
              <tr>
                <td>容错率</td>
                <td>
                  <select class="select select-sm" v-model="level" :disabled="loading" @change="onChange">
                    <template v-for="(item, idx) in levelList">
                      <option :value="item.lv" :disabled="item.disabled">{{ levelToStr(item.lv) + (levelToStr(99) === levelToStr(item.lv) ? ' · 默认' : '') }}</option>
                    </template>
                  </select>
                </td>
              </tr>
              <tr>
                <td>尺寸</td>
                <td>
                  <input type="number" placeholder="300" class="input input-sm" v-model="size" :disabled="loading" />
                </td>
              </tr>
              <tr>
                <td>码版本</td>
                <td>
                  <select class="select select-sm" name="version" v-model="version" :disabled="loading" @change="onChange">
                    <template v-for="(item, idx) in versionList">
                      <option :value="item.size" :disabled="item.disabled">{{ idx+1 + ': ' + item.size + 'x' + item.size }}</option>
                    </template>
                  </select>
                </td>
              </tr>
              <tr>
                <td>有无边距</td>
                <td class="leading-10">
                  <input type="checkbox" :disabled="loading" class="toggle toggle-info" v-model="quiet" @change="onChange" />
                </td>
              </tr>
              <tr>
                <td>码色</td>
                <td class="flex items-center">
                  <input type="color" :disabled="loading" v-model="darkColor" class="shrink-0" />
                  <input type="text" :disabled="loading" v-model="darkColor" class="input input-sm font-mono ml-1 flex-1 w-0" />
                </td>
              </tr>
              <tr>
                <td>底色</td>
                <td class="flex items-center">
                  <input type="color" :disabled="loading" v-model="lightColor" class="shrink-0" />
                  <input type="text" :disabled="loading" v-model="lightColor" class="input input-sm font-mono ml-1 flex-1 w-0" />
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="shadow bg-white rounded-xl flex-1 p-8">
      <textarea v-model="content" class="border rounded-xl w-full p-1 min-h-100" name="content" placeholder="输入内容" :disabled="loading" tabindex="1"></textarea>

      <template v-if="alertMsg">
        <div role="alert" class="alert alert-warning">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          {{ alertMsg }}
        </div>
      </template>

      <div class="flex justify-end mt-3">
        <button type="button" tabindex="2" class="btn btn-primary" :disabled="loading" @click="make">
          <span v-show="loading" class="loading loading-spinner"></span>
          生成{{ loading ? '中...' : '' }}
        </button>
      </div>
    </section>
  </div>

  <script>

  <script type="module">
    import { createApp, ref, nextTick, onMounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js'
    import init, { gen } from '/index.js';


    createApp({
      setup() {
        const typeList = [
          { name: "SVG", ext: ".svg", mime: "image/svg+xml" },
          { name: "PNG", ext: ".png", mime: "image/png" },
          { name: "JPEG", ext: ".jpeg", mime: "image/jpeg" },
          { name: "GIF", ext: ".gif", mime: "image/gif" },
          { name: "WebP", ext: ".webp", mime: "image/webp" },
          { name: "PNM", ext: ".pbm", mime: "image/x-portable-anymap" }, // application/x-portable-anymap
          { name: "TIFF", ext: ".tiff", mime: "image/tiff" },
          { name: "TGA", ext: ".tga", mime: "image/x-tga" },
          { name: "DDS", ext: ".dds", mime: "image/vnd.ms-dds" },
          { name: "BMP", ext: ".bmp", mime: "image/bmp" },
          { name: "ICO", ext: ".ico", mime: "image/x-icon" }, // 	image/vnd.microsoft.icon
          { name: "HDR", ext: ".hdr", mime: "application/octet-stream" },
          { name: "OpenEXR", ext: ".exr", mime: "image/x-exr" },
          { name: "Farbfeld", ext: ".ff", mime: "application/octet-stream" },
          { name: "AVIF", ext: ".avif", mime: "image/avif" },
          { name: "QOI", ext: ".qoi", mime: "application/octet-stream" },
        ];
        const levelList = [];
        const versionList = ref([]);

        for (let i = 0; i <= 3; i++) {
          levelList.push({
            lv: i,
            disabled: false,
          })
        }

        for (let i = 21; i <= 177; i+=4) {
          versionList.value.push({
            size: i,
            disabled: false,
          });
        }

        const start = ref(false);
        const loading = ref(false);
        const details = ref(false);
        const quiet = ref(false);
        const size = ref('300');
        const content = ref('');
        const type = ref(typeList[0].ext);
        const level = ref('0');
        const version = ref('' + versionList.value[0].size);
        const darkColor = ref('#000000');
        const lightColor = ref('#ffffff');
        let blob = null;
        const blobUrl = ref('');
        const alertMsg = ref('');
        const result = ref('SVG、L (7%)容错');

        onMounted(async () => {
          await init();
          start.value = true;
        })

        function levelToStr(lv) {
          switch (lv) {
            case 3: return 'H (30%)';
            case 2: return 'Q (25%)';
            case 1: return 'M (15%)';
            default: return 'L (7%)';
          }
        }

        async function make() {
          alertMsg.value = '';

          if (!content.value) {
            alertMsg.value = '请输入内容，再生成';
            return;
          }

          if (loading.value) return;
          loading.value = true;

          nextTick(() => {
            makeQR();
          });
        }

        function makeQR() {
          try {
            let res = gen(content.value, type.value, level.value, Number(size.value), quiet.value, lightColor.value, darkColor.value)
            // console.log(res)
            res = JSON.parse(res);
            if (res.err) {
              alertMsg.value = res.err;
              return;
            }
            // const bytes = atob(res.img);
            const binaryString = atob(res.img.replace(/%0A|\s/g, ''));

            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i) & 0xff;
            }

            let t = typeList.find(i => i.ext === res.ext);
            type.value = t.ext;

            version.value = res.width;
            versionList.value.forEach(v => {
              v.disabled = v.size < res.width;
            });

            blob = new Blob([bytes], { type: t.mime })
            blobUrl.value = URL.createObjectURL(blob);
            result.value = `${t.name}、${levelToStr(level.value)}容错`;
          } catch (error) {
            alertMsg.value = error;
          } finally {
            loading.value = false;
          }
        }

        function onChange() {
          if (blobUrl.value) make();
        }

        function download() {
          let filename = prompt('文件名', `${Date.now()}${type.value}`);
          saveAs(blob, filename);
        }

        return {
          typeList,
          levelList,
          versionList,
          loading,
          details,
          quiet,
          size,
          content,
          type,
          level,
          version,
          darkColor,
          lightColor,
          blobUrl,
          alertMsg,
          result,
          make,
          levelToStr,
          onChange,
          download,
        }
      }
    }).mount('#generator')
  </script>
</body>

</html>
